                      <div tabindex="0" class="component__body text__body">
                        <div class="component__body-inner text__body-inner"><!--?lit$525177427$--><p>You have learned a great deal about the Cisco IOS, navigating the IOS, and the command structure. Now, you are ready to configure devices! The first configuration command on any device should be to give it a unique device name or hostname. By default, all devices are assigned a factory default name. For example, a Cisco IOS switch is "Switch."</p>
<p>The problem is if all switches in a network were left with their default names, it would be difficult to identify a specific device. For instance, how would you know that you are connected to the right device when accessing it remotely using SSH? The hostname provides confirmation that you are connected to the correct device.</p>
<p>The default name should be changed to something more descriptive. By choosing names wisely, it is easier to remember, document, and identify network devices. Here are some important naming guidelines for hosts:</p>
<ul>
<li>Start with a letter</li>
<li>Contain no spaces</li>
<li>End with a letter or digit</li>
<li>Use only letters, digits, and dashes</li>
<li>Be less than 64 characters in length</li>
</ul>
<p>An organization must choose a naming convention that makes it easy and intuitive to identify a specific device. The hostnames used in the device IOS preserve capitalization and lowercase characters. For example, the figure shows that three switches, spanning three different floors, are interconnected together in a network. The naming convention that was used incorporated the location and the purpose of each device. Network documentation should explain how these names were chosen so additional devices can be named accordingly.</p>
</div>

                  <!--?lit$525177427$--> <div class="component__content">
                      <div tabindex="0" class="component__body text__body">
                        <div class="component__body-inner text__body-inner"><!--?lit$525177427$--><p>The use of weak or easily guessed passwords continues to be the biggest security concern of organizations. Network devices, including home wireless routers, should always have passwords configured to limit administrative access.</p>
<p>Cisco IOS can be configured to use hierarchical mode passwords to allow different access privileges to a network device.</p>
<p>All networking devices should limit administrative access by securing privileged EXEC, user EXEC, and remote Telnet access with passwords. In addition, all passwords should be encrypted and legal notifications provided.</p>
<p>When choosing passwords, use strong passwords that are not easily guessed. There are some key points to consider when choosing passwords:</p>
<ul>
<li>Use passwords that are more than eight characters in length.</li>
<li>Use a combination of upper and lowercase letters, numbers, special characters, and/or numeric sequences.</li>
<li>Avoid using the same password for all devices.</li>
<li>Do not use common words because they are easily guessed.</li>
</ul>
<p>Use an internet search to find a password generator. Many will allow you to set the length, character set, and other parameters.</p>
<p><strong>Note:</strong> Most of the labs in this course use simple passwords such as <strong>cisco</strong> or <strong>class</strong>. These passwords are considered weak and easily guessable and should be avoided in production environments. We only use these passwords for convenience in a classroom setting, or to illustrate configuration examples.</p>
</div>

                        <div class="component__body-inner text__body-inner"><!--?lit$525177427$--><p>Console access will now require a password before allowing access to the user EXEC mode.</p>

                      <div tabindex="0" class="component__body text__body">
                        <div class="component__body-inner text__body-inner"><!--?lit$525177427$--><p>Virtual terminal (VTY) lines enable remote access using Telnet or SSH to the device. Many Cisco switches support up to 16 VTY lines that are numbered 0 to 15.</p>
<p>To secure VTY lines, enter line VTY mode using the <strong>line vty 0 15</strong> global config command. Next, specify the VTY password using the <strong>password</strong> <em>password</em> command. Lastly, enable VTY access using the <strong>login</strong> command.</p>
<p>An example of securing the VTY lines on a switch is shown.</p>

                        <div class="component__body-inner text__body-inner"><!--?lit$525177427$--><p>Although requiring passwords is one way to keep unauthorized personnel out of a network, it is vital to provide a method for declaring that only authorized personnel should attempt to access the device. To do this, add a banner to the device output. Banners can be an important part of the legal process in the event that someone is prosecuted for breaking into a device. Some legal systems do not allow prosecution, or even the monitoring of users, unless a notification is visible.</p>
<p>To create a banner message of the day on a network device, use the <strong>banner motd #</strong> <em>the message of the day</em> <strong>#</strong> global config command. The “#” in the command syntax is called the delimiting character. It is entered before and after the message. The delimiting character can be any character as long as it does not occur in the message. For this reason, symbols such as the "#" are often used. After the command is executed, the banner will be displayed on all subsequent attempts to access the device until the banner is removed.</p>
<p>The following example shows the steps to configure the banner on Sw-Floor-1.</p>
